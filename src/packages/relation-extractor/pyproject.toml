[project]
authors = [
    { name = "jennifer Jiang-Kells", email = "jenniferjiangkells@gmail.com" },
]
requires-python = "<4.0,>=3.9"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community",
    "langchainhub<1.0.0,>=0.1.14",
    "replicate>=0.15.4",
