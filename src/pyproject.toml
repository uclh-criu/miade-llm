[project]
name = "miade-llm"
version = "0.1.0"
description = "A collection of chains for the detailed extraction of diagnosis in medical ntoes"
authors = [
    { name = "Jennifer Jiang-Kells", email = "jenniferjiangkells@gmail.com" },
]
requires-python = ">=3.9, <3.12"
readme = "README.md"
dependencies = [
    "uvicorn>=0.23.2,<0.24",
    "langserve[server]",
    "relation-extractor",
    "coder",
    "langchain-ollama>=0.1.3",
    "medcat>=1.7.4",
    "langchain-openai>=0.1.25",
    "openai>=1.61.1",
    "langchain[anthropic]>=0.3.0",
    "langchain-anthropic>=0.3.7",
]

[dependency-groups]
dev = [
    "langchain-cli>=0.0.22",
    "jupyterlab>=4.2.5,<5",
    "python-dotenv>=1.0.1,<2",
    "ipykernel>=6.29.5,<7",
]

[tool.uv]

[tool.uv.sources]
relation-extractor = { path = "packages/relation-extractor", editable = true }
coder = { path = "packages/coder", editable = true }

[tool.hatch.build.targets.sdist]
include = ["app"]

[tool.hatch.build.targets.wheel]
include = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
